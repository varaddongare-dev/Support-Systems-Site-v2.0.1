<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="100%" height="100%">
  <defs>
    <!-- Smooth Happy Gradients -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11698e" />
      <stop offset="100%" stop-color="#1a8cb3" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#59c36a" />
      <stop offset="100%" stop-color="#3cb04e" />
    </linearGradient>
    <linearGradient id="joyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb037" />
      <stop offset="100%" stop-color="#f47373" />
    </linearGradient>
  </defs>

  <!-- LOGO MARK (Icon) -->
  <g transform="translate(10, 10)">
    <!-- Grounding Left Pause Bar -->
    <rect x="15" y="20" width="16" height="60" rx="8" fill="url(#blueGrad)" />
    
    <!-- Joyful Creative Right Pause Bar (Splitting into fluid, happy droplet shapes) -->
    <rect x="42" y="32" width="16" height="48" rx="8" fill="url(#greenGrad)" />
    
    <!-- Blooming Creative Accents / "Paint Drops" -->
    <circle cx="50" cy="18" r="9" fill="url(#joyGrad)" />
    <circle cx="72" cy="35" r="7.5" fill="#ffb037" />
    <circle cx="70" cy="58" r="6" fill="#f47373" />
  </g>

  <!-- LOGO TYPOGRAPHY -->
  <!-- "the" - Elegant & Minimal -->
  <text x="110" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" letter-spacing="0.15em" fill="#5c6b68" opacity="0.8" text-transform="uppercase">the</text>
  
  <!-- "PAUSE" - Balanced & Clear -->
  <text x="110" y="84" font-family="Georgia, serif" font-size="36" font-weight="bold" letter-spacing="0.02em" fill="#11698e">PAUSE</text>
  
  <!-- "PROJECT" - Vibrant Accent -->
  <text x="250" y="84" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="800" letter-spacing="-0.01em" fill="url(#greenGrad)">project</text>
</svg>
